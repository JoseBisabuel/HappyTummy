<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Tienda Vegetariana Vitalis</title>
    <link rel="stylesheet" href="styles.css?v=1.0.6">
    <link rel="icon" type="image/x-icon" href="assets/icons/fondoVitalis.png">
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/icons/fondoVitalis.png" alt="Logo de Vitalis" loading="lazy" decoding="async">
        </div>
        <nav>
            <ul class="nav-search-list">
                <li class="nav-search"><input type="text" id="buscador-productos" placeholder="Buscar productos..." autocomplete="off"><button type="button" class="search-clear" aria-label="Borrar busqueda" hidden>&times;</button><div id="resultados-busqueda" class="search-results" hidden></div></li>
            </ul>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">&#9776;</button>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#productos">Volver</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="index.html#recetas">Recetas</a></li>
            </ul>
        </nav>
    </header>
    <div class="back-to-products">
        <a href="index.html#productos" class="back-btn">Volver</a>
    </div>
    <main>
        <section class="cart">
            <h2>Carrito de Compras</h2>
            <div class="cart-items">
                <!-- Los productos añadidos al carrito aparecerán aquí -->
            </div>
            <div class="cart-total">
                <p>Total: $<span id="total">0</span></p>
            </div>
            <button id="checkout">Finaliza tu compra</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2014 Tienda vegetariana y vegana Vitalis. Todos los derechos reservados.</p>
    </footer>
    <a href="https://wa.me/3144030783" class="whatsapp-btn" target="_blank">
        <img src="assets/icons/whatsapp.png" alt="WhatsApp" loading="lazy" decoding="async">
    </a>
    <script src="js/main.js"></script>   
    <script src="js/productos-data.js"></script>   
    <script src="js/buscador.js"></script>   
    <script src="js/carrito.js"></script> 
</body>
</html>
